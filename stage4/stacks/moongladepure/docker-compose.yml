version: '3.9'

services:
  shared-db:
    image: pubhub.aiursoft.com/mysql
    volumes:
      - shared-db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=shared_password_change_me
    networks:
      - shared_db_net
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
      update_config:
        order: stop-first
        delay: 60s

  anduin:
    depends_on:
      - shared-db
    image: aiursoft/moongladepure
    volumes:
      - anduin-files:/data/files
      - anduin-aspnet:/data/.aspnet/
    environment:
      - OpenAI__CompletionApiUrl=https://ollama.aiursoft.com/api/chat
      - OpenAI__Model=qwen3:30b-a3b-instruct-2507-q8_0
      - OpenAI__Token={{OLLAMA_GATEWAY_API_KEY}}
      - ConnectionStrings__DefaultConnection=Server=shared-db;Database=anduin;Uid=root;Pwd=shared_password_change_me;
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - AppSettings__AuthProvider=OIDC
      - OIDC__Authority=https://auth.aiursoft.com/application/o/anduinblog
      - OIDC__ClientId={{ANDUIN_BLOG_CLIENT_ID}}
      - OIDC__ClientSecret={{ANDUIN_BLOG_CLIENT_SECRET}}
    networks:
      - proxy_app
      - shared_db_net
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s
  
