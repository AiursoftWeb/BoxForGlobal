version: "3.9"

x-v2-blog: &v2-blog
  image: pubhub.aiursoft.com/aiursoft/moongladev2:latest
  stop_grace_period: 20s
  networks:
    - proxy_app
    - shared-db-internal
    - clickhouse_net
  deploy:
    replicas: 0
    labels:
      shepherd.autoupdate: "true"
    resources:
      limits:
        cpus: "2.0"
        memory: 2G
    update_config:
      order: start-first
      delay: 5s

x-v2-environment: &v2-environment
  ConnectionStrings__DbType: MySql
  Storage__Path: /data/files
  AppSettings__AuthProvider: OIDC
  AppSettings__DefaultRole: Administrators
  GlobalSettings__OpenAiChatEndpoint: https://ollama.aiursoft.com/v1/chat/completions
  GlobalSettings__OpenAiModel: aiursoft-instruct:latest
  GlobalSettings__OpenAiApiToken: "{{NEW_BLOGS_OLLAMA_TOKEN}}"
  GlobalSettings__EnableEmbeddingBasedSearch: "true"
  Logging__Clickhouse__Enabled: "true"
  Logging__Clickhouse__ConnectionString: Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs

services:
  dvorak:
    image: pubhub.aiursoft.com/aiursoft/moongladev2:latest
    volumes:
      - dvorak-aspnet:/data/.aspnet/
      - dvorak-files:/data/files
    environment:
      ConnectionStrings__DefaultConnection: Server=dvorak-db;Database=moongladev2;Uid=moongladev2;Pwd=<dvorak_password>;
      ConnectionStrings__DbType: MySql
      Storage__Path: /data/files
      AppSettings__AuthProvider: OIDC
      AppSettings__DefaultRole: Administrators
      AppSettings__OIDC__Authority: https://auth.aiursoft.com/application/o/dvorakblog/
      AppSettings__OIDC__ClientId: "{{DVORAK_BLOG_CLIENT_ID}}"
      AppSettings__OIDC__ClientSecret: "{{DVORAK_BLOG_CLIENT_SECRET}}"
      GlobalSettings__OpenAiChatEndpoint: https://ollama.aiursoft.com/v1/chat/completions
      GlobalSettings__OpenAiModel: aiursoft-instruct:latest
      GlobalSettings__OpenAiApiToken: "{{NEW_BLOGS_OLLAMA_TOKEN}}"
      GlobalSettings__EnableEmbeddingBasedSearch: "true"
      Logging__Clickhouse__Enabled: "true"
      Logging__Clickhouse__ConnectionString: Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs
      Logging__Clickhouse__TableName: DvorakBlogLogs
    networks:
      - proxy_app
      - dvorak-internal
      - clickhouse_net
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

  dvorak-db:
    image: pubhub.aiursoft.com/mysql:9.7.0
    command: --skip-log-bin
    volumes:
      - dvorak-db:/var/lib/mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
      MYSQL_DATABASE: moongladev2
      MYSQL_USER: moongladev2
      MYSQL_PASSWORD: <dvorak_password>
    networks:
      - dvorak-internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

  shared-db:
    image: pubhub.aiursoft.com/mysql:9.7.0
    command: --skip-log-bin
    volumes:
      - shared-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: newblogs_password_change_me
    networks:
      - shared-db-internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
      update_config:
        order: stop-first
        delay: 60s

  anduin:
    <<: *v2-blog
    volumes:
      - anduin-aspnet:/data/.aspnet/
      - anduin-files:/data/files
    environment:
      <<: *v2-environment
      ConnectionStrings__DefaultConnection: Server=shared-db;Database=anduin;Uid=root;Pwd=newblogs_password_change_me;
      AppSettings__OIDC__Authority: https://auth.aiursoft.com/application/o/anduinblog/
      AppSettings__OIDC__ClientId: "{{ANDUIN_BLOG_CLIENT_ID}}"
      AppSettings__OIDC__ClientSecret: "{{ANDUIN_BLOG_CLIENT_SECRET}}"
      Logging__Clickhouse__TableName: AnduinBlogLogs

  jimmoen:
