version: "3.9"

services:
  app:
    depends_on:
      - db
    image: pubhub.aiursoft.com/aiursoft/apkg:latest
    volumes:
      - apkg-aspnet:/data/.aspnet/
      - apkg-files:/data/files
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=apkg;Uid=apkg;Pwd=<apkg_password>;
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - AppSettings__AuthProvider=OIDC
      - AppSettings__OIDC__Authority=https://auth.aiursoft.com/application/o/apkg
      - AppSettings__OIDC__ClientId={{APKG_CLIENT_ID}}
      - AppSettings__OIDC__ClientSecret={{APKG_CLIENT_SECRET}}
      - Logging__Clickhouse__Enabled=true
      - Logging__Clickhouse__ConnectionString=Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs
      - Logging__Clickhouse__TableName=ApkgLogs
    networks:
      - proxy_app
      - internal
      - clickhouse_net
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

  db:
    image: pubhub.aiursoft.com/mysql
    volumes:
      - apkg-db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=apkg
      - MYSQL_USER=apkg
      - MYSQL_PASSWORD=<apkg_password>
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  apkg-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/apkg-data/files
  apkg-aspnet:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/apkg-data/aspnet
  apkg-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/apkg-data/mysql

networks:
  proxy_app:
    external: true
  clickhouse_net:
    external: true
  internal:
    driver: overlay