apkg.aiursoft.com {
    log
    import hsts
    import limit_to_cloudflare
    encode br gzip

    reverse_proxy http://apkg_app:5000 {
    }
}

apkg-dav.aiursoft.com {
    log
    import hsts
    encode zstd gzip

    @edge {
        remote_ip 80.240.30.8 139.180.153.81 66.42.69.8 private_ranges
    }
    handle @edge {
        root * /data/apkg-export
        file_server browse {
            hide .stage .prev _tmp .partial .tmp
        }

        header * Cache-Control "no-cache"
        header /artifacts/anduinos/*/pool/*.deb Cache-Control "public, max-age=31536000, immutable"
    }
    handle {
        abort
    }
}
