apkg.aiursoft.com {
    log
    import hsts
    import limit_to_cloudflare
    encode br gzip

    reverse_proxy http://apkg_app:5000 {
    }
}

apkg-dav.aiursoft.com {
    log
    import hsts
    import limit_to_cloudflare
    encode br gzip

    reverse_proxy http://apkg_webdav:8080 {
        header_up Host {host}
        header_up X-Real-IP {remote}
        header_up X-Forwarded-Proto {scheme}
    }
}
