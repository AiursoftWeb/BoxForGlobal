version: "3.9"

services:
  app:
    depends_on:
      - db
    image: pubhub.aiursoft.com/aiursoft/employeecenter:latest
    volumes:
      - employeecenter-aspnet:/data/.aspnet/
      - employeecenter-files:/data/files
      - employeecenter-context:/export
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=mth;Uid=mth;Pwd=<mth_password>;
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - AlertCenter__Enabled={{EPEC_ALERTCENTER_ENABLED}}
      - AlertCenter__Endpoint=https://alertcenter.aiursoft.com
      - AlertCenter__ApiKey={{EPEC_ALERTCENTER_API_KEY}}
      - AlertCenter__PublicBaseUrl=https://employee.aiursoft.com
      - AppSettings__AuthProvider=OIDC
      - AppSettings__OIDC__Authority=https://auth.aiursoft.com/application/o/employeecenter
      - AppSettings__OIDC__ClientId={{EPEC_CLIENT_ID}}
      - AppSettings__OIDC__ClientSecret={{EPEC_CLIENT_SECRET}}
      - AppSettings__OCR__Enabled=true
      - AppSettings__OCR__Endpoint=https://ocr.aiursoft.com/api/ocr/pdf
      - AppSettings__OCR__BearerToken={{EPEC_OCR_BEARER_TOKEN}}
      - AppSettings__ASR__Enabled=true
      - AppSettings__ASR__Endpoint=https://stt.aiursoft.com/v1/audio/transcriptions
      - AppSettings__ASR__BearerToken={{EPEC_ASR_BEARER_TOKEN}}
      - AppSettings__ASR__Model=whisperx
      - AppSettings__ASR__Level=large-v3
      - AppSettings__ASR__Language=
      - AppSettings__ASR__SegmentDurationSeconds=1800
      - AppSettings__ASR__SegmentOverlapSeconds=2
      - AppSettings__ASR__PreferOriginalSegmentCodec=true
      - AppSettings__ASR__TimeoutSeconds=7200
      - AppSettings__ASR__AsrMaxRetryCount=30
      - AppSettings__ASR__AsrMaxEmptyRetryCount=10
      - AppSettings__ExportPath=/export
      - AppSettings__Agent__Endpoint=http://agent:8000/ask
      - Logging__Clickhouse__Enabled=true
      - Logging__Clickhouse__ConnectionString=Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs
      - Logging__Clickhouse__TableName=EmployeeCenterLogs
    networks:
      - proxy_app
      - internal
      - clickhouse_net
      - agent
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

  agent:
    image: pubhub.aiursoft.com/aiursoft/folderagent:latest
    volumes:
      - employeecenter-context:/import:ro
    environment:
      - ANTHROPIC_API_KEY={{EMPL_AGENT_KEY}}
      - ANTHROPIC_BASE_URL=https://ollama.aiursoft.com
      - CLAUDE_MODEL=aiursoft-super:latest
      - PROVIDER=claude
    networks:
      - agent
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

  db:
    image: pubhub.aiursoft.com/mysql:9.7.0
    command: --skip-log-bin
    volumes:
      - employeecenter-db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=mth
      - MYSQL_USER=mth
      - MYSQL_PASSWORD=<mth_password>
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  employeecenter-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/employeecenter-data/files
  employeecenter-aspnet:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/employeecenter-data/aspnet
  employeecenter-context:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/employeecenter-data/context
  employeecenter-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/employeecenter-data/mysql

networks:
  proxy_app:
    external: true
  clickhouse_net:
    external: true
  internal:
    driver: overlay
  agent:
    driver: overlay
