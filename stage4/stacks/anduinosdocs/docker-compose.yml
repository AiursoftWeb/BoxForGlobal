version: "3.9"

services:
  app:
    depends_on:
      - db
    image: pubhub.aiursoft.com/aiursoft/docsviewer:latest
    volumes:
      - anduinosdocs-aspnet:/data/.aspnet/
      - anduinosdocs-files:/data/files
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=anduinosdocs;Uid=anduinosdocs;Pwd=<anduinosdocs_password>;
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - AppSettings__AuthProvider=OIDC
      - AppSettings__OIDC__Authority=https://auth.aiursoft.com/application/o/anduinosdocs
      - AppSettings__OIDC__ClientId={{ANDUINOSDOCS_CLIENT_ID}}
      - AppSettings__OIDC__ClientSecret={{ANDUINOSDOCS_CLIENT_SECRET}}
      - Logging__Clickhouse__Enabled=true
      - Logging__Clickhouse__ConnectionString=Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs
      - Logging__Clickhouse__TableName=AnduinosdocsLogs
    networks:
      - proxy_app
      - internal
      - clickhouse_net
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

  db:
    image: pubhub.aiursoft.com/mysql:9.7.0
    command: --skip-log-bin
    volumes:
      - anduinosdocs-db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=anduinosdocs
      - MYSQL_USER=anduinosdocs
      - MYSQL_PASSWORD=<anduinosdocs_password>
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  anduinosdocs-aspnet:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/anduinosdocs-data/aspnet
  anduinosdocs-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/anduinosdocs-data/files
  anduinosdocs-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/anduinosdocs-data/mysql

networks:
  proxy_app:
    external: true
  clickhouse_net:
    external: true
  internal:
    driver: overlay