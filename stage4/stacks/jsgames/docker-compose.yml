version: "3.9"

services:
  ipcalc:
    image: pubhub.aiursoft.com/anduin2019/ipcalc:latest
    networks:
      - proxy_app
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: stop-first
        delay: 60s

  aoe:
    image: pubhub.aiursoft.com/anduin2019/aoemini:latest
    networks:
      - proxy_app
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: stop-first
        delay: 60s

  avigame:
    image: pubhub.aiursoft.com/anduin2019/avigame
    networks:
      - proxy_app
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: stop-first
        delay: 60s

networks:
  proxy_app:
    external: true
