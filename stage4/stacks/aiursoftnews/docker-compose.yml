version: "3.9"

services:
  app:
    depends_on:
      - db
    image: pubhub.aiursoft.com/aiursoft/moongladev2:latest
    volumes:
      - aiursoftnews-aspnet:/data/.aspnet/
      - aiursoftnews-files:/data/files
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=moongladev2;Uid=moongladev2;Pwd=<moongladev2_password>;
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - AppSettings__AuthProvider=OIDC
      - AppSettings__OIDC__Authority=https://auth.aiursoft.com/application/o/news-center/
      - AppSettings__OIDC__ClientId={{NEWS_CENTER_CLIENT_ID}}
      - AppSettings__OIDC__ClientSecret={{NEWS_CENTER_CLIENT_SECRET}}
      - Logging__Clickhouse__Enabled=true
      - Logging__Clickhouse__ConnectionString=Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs
      - Logging__Clickhouse__TableName=NewsCenterLogs
    networks:
      - proxy_app
      - internal
      - clickhouse_net
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

  db:
    image: pubhub.aiursoft.com/mysql:9.7.0
    command: --skip-log-bin
    volumes:
      - aiursoftnews-db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=moongladev2
      - MYSQL_USER=moongladev2
      - MYSQL_PASSWORD=<moongladev2_password>
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  aiursoftnews-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/aiursoftnews-data/files
  aiursoftnews-aspnet:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/aiursoftnews-data/aspnet
  aiursoftnews-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/aiursoftnews-data/mysql

networks:
  proxy_app:
    external: true
  clickhouse_net:
    external: true
  internal:
    driver: overlay
