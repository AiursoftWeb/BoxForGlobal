version: '3.9'

services:
  app:
    depends_on:
      - db
    image: pubhub.aiursoft.com/aiursoft/anduinoshome:latest
    volumes:
      - anduinos-home-aspnet:/data/.aspnet/
      - anduinos-home-files:/data/files
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=mth;Uid=mth;Pwd=<mth_password>;
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - AppSettings__AuthProvider=OIDC
      - AppSettings__OIDC__Authority=https://auth.aiursoft.com/application/o/anduinos-home
      - AppSettings__OIDC__ClientId={{AOH_CLIENT_ID}}
      - AppSettings__OIDC__ClientSecret={{AOH_CLIENT_SECRET}}
      - Logging__Clickhouse__Enabled=true
      - Logging__Clickhouse__ConnectionString=Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs
      - Logging__Clickhouse__TableName=AnduinOSHomeLogs
    networks:
      - proxy_app
      - internal
      - clickhouse_net
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

  db:
    image: pubhub.aiursoft.com/mysql:9.7.0
    command: --skip-log-bin
    volumes:
      - anduinos-home-db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=mth
      - MYSQL_USER=mth
      - MYSQL_PASSWORD=<mth_password>
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  anduinos-home-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/anduinos-home-data/files
  anduinos-home-aspnet:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/anduinos-home-data/aspnet
  anduinos-home-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/anduinos-home-data/mysql

networks:
  proxy_app:
    external: true
  clickhouse_net:
    external: true
  internal:
    driver: overlay
