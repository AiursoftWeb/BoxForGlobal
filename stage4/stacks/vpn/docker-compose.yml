version: '3.9'

services:
  vpn:
    image: pubhub.aiursoft.com/aiursoft/gateway
    networks:
      # Only Caddy shares this network; business backends stay on proxy_app.
      - vpn_ingress
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - vpn-data:/var/log/xray
    environment:
      - XRAY_UUID={{XRAY_UUID}}
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: start-first
        delay: 5s

networks:
  vpn_ingress:
    external: true

volumes:
  vpn-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/vpn-data
