# Untrusted.
npm.aiursoft.com {
    log
    import hsts
    import limit_to_cloudflare
    encode br gzip
    # The router performs transparent DNS interception for all *.aiursoft.com queries
    # (TTL=0 on all responses), hijacking UDP port 53 before it reaches Cloudflare.
    # certmagic's propagation check uses UDP DNS and therefore can never see the
    # _acme-challenge TXT record even though Cloudflare has it.
    # Fix: skip certmagic's local propagation check entirely (propagation_timeout -1)
    # and add a 60s delay (propagation_delay 60s) so Cloudflare can propagate the
    # fresh TXT record to all PoPs before Let's Encrypt verifies it.
    tls {
        dns cloudflare {env.CLOUDFLARE_API_TOKEN}
        resolvers 1.1.1.1
        propagation_timeout -1
        propagation_delay 60s
    }
    reverse_proxy http://npm_npm:4873 {
    }
}

