
mirror-ppa.aiursoft.com {
    log
    import hsts
    import limit_to_cloudflare
    encode br gzip
    respond /robots.txt 200 {
            body "User-agent: *
Disallow: /"
    }
    @healthcheck {
        method HEAD
        path /
    }
    respond @healthcheck 200
    reverse_proxy http://ppamirror_web_ppa:5000 {
    }
}

