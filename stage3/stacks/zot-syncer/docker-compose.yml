version: '3.9'

services:
  syncer:
    image: localhost:8080/box_starting/local_zot_syncer
    volumes:
      - zot-blob:/data/blob
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  zot-blob:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/zot-data/blob

networks:
  net:
    driver: overlay
